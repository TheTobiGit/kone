[package]
name = "kone-native"
description = "kone's native macOS shell."
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "kone"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
kone-theme.workspace = true
kone-rpc.workspace = true
image = { version = "0.25", default-features = false }
smallvec = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton"] }
raw-window-handle = "0.6"
