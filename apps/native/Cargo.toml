[package]
name = "kone-native"
description = "kone's native macOS shell."
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "kone"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc = "0.2"
gpui-kit.workspace = true
# The engine only (springs, tweens, retargeting); its GPUI bindings target
# gpui-ce, so the picker drives our own elements from its values.
gpui-ce-motion = { version = "0.4", default-features = false }
kone-theme.workspace = true
kone-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton"] }
raw-window-handle = "0.6"
