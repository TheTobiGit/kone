[workspace]
resolver = "3"
members = ["apps/native", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
gpui-kit = "0.8.1"
kone-theme = { path = "crates/kone-theme" }
kone-rpc = { path = "crates/kone-rpc" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPUI's renderer and layout engine are hot paths even while iterating; leaving
# them unoptimised makes a debug window stutter on resize.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
strip = "symbols"
