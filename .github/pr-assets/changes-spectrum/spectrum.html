<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change spectrum</title><style>
  :root{--bg:#f2f2ef;--card:#fbfbfa;--ink:#18181a;--soft:#57575a;--muted:#8c8c90;--add:#30a46c;--del:#e5484d;--line:#00000014;--wait:#0000001f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--soft);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  main{width:min(1640px,100% - 32px);margin:48px auto}
  .hdr{display:grid;grid-template-columns:420px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:26px 0 22px}
  .hdr__lead{padding:0 26px 0 40px}
  .hdr__big{font-size:30px;font-weight:600;letter-spacing:-0.025em;color:var(--ink);line-height:1}
  .hdr__sub{margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
  .hdr__nums{margin-top:18px;font-family:ui-monospace,Menlo,monospace;font-size:15px}
  .hdr__add{color:var(--add)}.hdr__del{color:var(--del)}
  .hdr__chart{min-width:0;padding-right:24px}
  .spectrum{display:block;width:100%;height:auto;overflow:visible}
  .base{stroke:var(--line);stroke-width:1}
  .sep{stroke:var(--line);stroke-width:1}
  .area{fill:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .area-count{fill:#c2c2bf}
  .rod{transform-origin:center 158px;animation:grow .7s cubic-bezier(.32,.72,0,1) both}
  .rod--add{fill:var(--add)}
  .rod--del{fill:var(--del)}
  .rod--mid{fill:#8a8a8f}
  .rod--waiting{opacity:.4}
  .cap{opacity:.85}
  .cap--add{fill:var(--add)}.cap--del{fill:var(--del)}
  .cap--waiting{opacity:.4}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .hdr__foot{grid-column:1 / -1;display:flex;justify-content:space-between;gap:24px;padding:14px 40px 0;border-top:1px solid var(--line);margin-top:18px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
  .key{display:inline-flex;align-items:center;gap:6px;margin-right:16px}
  .key i{display:inline-block;width:10px;height:10px;border-radius:3px}
  .key i.a{background:var(--add)}.key i.d{background:var(--del)}.key i.w{background:#8a8a8f;opacity:.4}
  @media (prefers-reduced-motion:reduce){.rod{animation:none}}
  @media (prefers-color-scheme:dark){
    :root{--bg:#070708;--card:#131315;--ink:#f4f4f5;--soft:#b4b4b8;--muted:#7a7a80;--line:#ffffff14;--wait:#ffffff29}
    .rod--mid{fill:#8a8a8f}
    .area-count{fill:#5a5a60}
  }
</style></head><body><main><section class="hdr">
